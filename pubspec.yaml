name: lifeos
description: Offline-first personal productivity operating system.
publish_to: "none"

version: 0.1.0+1

environment:
  sdk: ">=3.8.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State Management
  flutter_riverpod: ^2.6.1

  # Navigation
  go_router: ^16.2.0

  # Database
  drift: ^2.29.0
  sqlite3_flutter_libs: ^0.5.39
  path_provider: ^2.1.5
  path: ^1.9.1

  # Notifications
  flutter_local_notifications: ^19.4.1

  # Charts
  fl_chart: ^1.1.1

  # Reports
  pdf: ^3.11.3
  printing: ^5.14.2

  # Sharing
  share_plus: ^11.1.0

  # File Picker
  file_picker: ^10.3.2

  # Permissions
  permission_handler: ^12.0.1

  # Date & Time
  intl: ^0.20.2

  # Utilities
  uuid: ^4.5.1
  collection: ^1.19.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  drift_dev: ^2.29.0
  build_runner: ^2.7.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/

  fonts: []